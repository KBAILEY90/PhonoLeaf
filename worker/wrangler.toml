name = "phonoleaf-entitlement"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Explicit rather than left to Wrangler's defaults (2026-08-28, after the
# first `deploy` warned both were unset). No custom domain exists for
# production yet, so it needs workers.dev; Preview URLs (a separate public
# URL per deployed version, persisting even after a newer version ships)
# add exposed surface this backend doesn't have a use for — `wrangler dev`
# covers local testing and the staging environment below covers
# pre-production testing, so there's no gap this would fill.
workers_dev = true
preview_urls = false

# Cloudflare D1: entitlement records, keyed by sub_hash (PAYMENTS_SPEC.md §2).
# Migrated off KV (2026-08-28) — D1 turned out both strongly consistent AND
# cheaper per-operation than KV at any scale this app will realistically
# hit; see PAYMENTS_SPEC.md §13 for the full reasoning.
#
# Database created 2026-08-28 (`npx wrangler d1 create phonoleaf-entitlement`).
# Still needed before this is live: apply the schema
# (migrations/0001_create_entitlements.sql) to the real database, then
# deploy:
#   npx wrangler d1 migrations apply phonoleaf-entitlement --remote
#   npx wrangler deploy
# For local dev, `wrangler dev` runs entirely against a local emulated D1
# file (no cloud auth needed, never touches production data) — apply the
# same migration locally first:
#   npx wrangler d1 migrations apply phonoleaf-entitlement --local
[[d1_databases]]
binding = "DB"
database_name = "phonoleaf-entitlement"
database_id = "b5c17050-89e4-490d-98d4-10d8ab3dcaf8"
migrations_dir = "migrations"

# Per-IP rate limit on /entitlement (audit finding M3, 2026-09-01). Applied
# BEFORE Google token verification, because verifying costs a JWKS-backed
# signature check and a first-time caller then costs a D1 write — so without
# this, unauthenticated junk traffic bills us on every request.
#
# 60 requests per 60s per IP. Deliberately generous: the app calls this on
# launch and on refresh, not in a loop, and the key is the client IP, so users
# behind one NAT (an office, a carrier) share a bucket. A real user never comes
# close; an abusive caller is bounded hard.
#
# `period` accepts only 10 or 60. `namespace_id` is a per-account identifier
# for the limiter, not a secret. The code fails OPEN if this binding is
# missing, so an older deploy or a local `wrangler dev` without it still works.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[vars]
# Non-secret config. Both are already public (they're in index.html /
# AndroidManifest.xml) — duplicated here because the Worker deploys
# independently of the app. See CLAUDE.md "Critical facts" for the
# canonical values if these ever need to change.
GOOGLE_CLIENT_ID = "88179965472-codmbgtm99mgik9qke2kucbvfkbug3ul.apps.googleusercontent.com"
GOOGLE_ANDROID_CLIENT_ID = "88179965472-cs9869nsk2b9i00v5ebo8sd9mrq9kmmn.apps.googleusercontent.com"
TRIAL_DAYS = "7"

# Secrets — never put these in this file. Set with `wrangler secret put NAME`:
#   SUB_HASH_PEPPER              random string, pepper for hashing `sub` (§1)
#   ENTITLEMENT_JWT_PRIVATE_KEY  ES256 private key as JWK JSON (§6) —
#                                 generate with `npm run generate-keys`
#
# Added later, once their prerequisite in PAYMENTS_SPEC.md §11 exists:
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, PLAY_SERVICE_ACCOUNT_JSON,
#   EYDLE_LAB_SECRET (staging only)

# Staging environment (PAYMENTS_SPEC.md §11 #9 / §12): the next CASA
# assessment's DAST scan needs a URL that maps to a subdomain of an
# Authorized domain registered with Google — a *.workers.dev URL doesn't
# qualify. Deliberately a SEPARATE environment (own D1 database below),
# not a route pointed at the production Worker/data — §12 also calls for a
# staging-only, environment-gated auth-bypass route for the lab's test
# account later, which must be physically absent from production.
# Deploy with: npx wrangler deploy --env staging
# custom_domain=true asks Cloudflare to manage the DNS record + SSL cert
# for this route itself — needs `zone:edit` on the account (this session's
# token is zone:read only), so the deploy will likely stop short of fully
# provisioning it. Finishing that from the dashboard (Workers & Pages →
# this Worker → Settings → Domains & Routes → Add Custom Domain →
# api.staging.phonoleaf.com) is a ~30s manual step from there.
[env.staging]
routes = [
  { pattern = "api.staging.phonoleaf.com", custom_domain = true }
]
# Reachable ONLY via the custom domain above — a workers.dev fallback
# would defeat the point of keeping staging on a separate, deliberately
# chosen URL (§12), and Preview URLs are off for the same
# minimal-surface reasoning as production above.
workers_dev = false
preview_urls = false

# Staging gets its own limiter namespace so a CASA DAST scan hammering
# staging can never consume production's budget.
[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[env.staging.vars]
GOOGLE_CLIENT_ID = "88179965472-codmbgtm99mgik9qke2kucbvfkbug3ul.apps.googleusercontent.com"
GOOGLE_ANDROID_CLIENT_ID = "88179965472-cs9869nsk2b9i00v5ebo8sd9mrq9kmmn.apps.googleusercontent.com"
TRIAL_DAYS = "7"

# Own database from production (§12: a leak during a third-party security
# scan against staging can't touch real entitlement data). Created
# 2026-08-28. Apply the schema + deploy the same way as production above,
# targeting this database name and --env staging.
[[env.staging.d1_databases]]
binding = "DB"
database_name = "phonoleaf-entitlement-staging"
database_id = "4b5de02b-d72d-41e3-9cbb-bc2932eca035"
migrations_dir = "migrations"
