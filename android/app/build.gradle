apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release signing. The keystore and its passwords must NEVER be committed —
// see .gitignore, which excludes *.jks/*.keystore and this properties file.
// Create android/keystore.properties (gitignored) with:
//     storeFile=C:/path/outside/the/repo/phonoleaf-release.jks
//     storePassword=...
//     keyAlias=phonoleaf
//     keyPassword=...
// If that file is absent, no release signingConfig is registered at all and
// `assembleRelease` produces an unsigned build — deliberate, so a fresh clone
// and every debug build still work with nothing extra set up. Losing this
// keystore means never being able to update the Play listing again: back it
// up somewhere durable and off this machine before the first upload.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "com.phonoleaf.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.phonoleaf.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Versioning scheme: versionCode is a plain integer that MUST increase
        // on every upload to Play (it is the only thing Play orders builds by,
        // and a code already uploaded can never be reused, even after a
        // rollback). versionName is the human string shown in the store and in
        // Settings. Bump versionCode by 1 for every build sent to any Play
        // track including internal testing, and move versionName only when the
        // release is user-visible.
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Ship only phone ABIs — the sherpa-onnx AAR carries native libs for
        // four architectures; real devices are arm. Halves the APK.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Don't let aapt compress the ONNX model — compressed ML assets can be
    // misaligned when accessed directly. (We copy to filesDir before loading,
    // but keep this per sherpa-onnx guidance.)
    androidResources {
        noCompress += ['onnx', 'bin']
    }
    // Must match capacitor.build.gradle's compileOptions (regenerated by every
    // `cap sync`, applied AFTER this file, so it wins for Java regardless of
    // what's set here) — kept in sync explicitly so Kotlin doesn't drift from
    // it, which is what caused "Inconsistent JVM-target compatibility".
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    signingConfigs {
        // Registered only when keystore.properties exists (see the top of this
        // file). Referencing a signingConfig that was never created is a
        // configuration-time failure, which is why the buildType below guards
        // on the same condition rather than naming it unconditionally.
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        // TEMPORARY, for verifying the R8 keep rules on a build that can be
        // installed over the existing debug app without losing books or voice
        // packs (a release build is signed differently and would need an
        // uninstall). REMOVE once verified: debug builds should stay fast.
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // Enabled 2026-09-01. Without it the shipped app is trivially
            // readable, which stops mattering only until the entitlement check
            // exists — that check is precisely what someone would look for.
            // See proguard-rules.pro: everything reached by NAME at runtime
            // (the sherpa JNI callbacks, Capacitor's plugin discovery, Tink's
            // key managers, the manifest's service names) needs an explicit
            // keep rule, and getting one wrong fails silently on device rather
            // than at build time.
            minifyEnabled true
            // Newer AGP rejects 'proguard-android.txt' (it forces -dontoptimize);
            // the -optimize variant is required.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    // AIDL is off by default from AGP 8 onward and this project is on 9.2.1,
    // so the ITtsService interface would silently not be generated without
    // this. Required for the out-of-process speech engine (TtsService.kt).
    buildFeatures {
        aidl true
    }

    // The GPL-3.0 speech engine bridge lives OUTSIDE this module's source tree,
    // in android/tts-bridge/, with its own LICENSE and its own package name
    // (com.phonoleaf.ttsbridge). PhonoLeaf's own code is proprietary and lives
    // under com.phonoleaf.app.
    //
    // Keeping them in separate directories with separate licences is the point,
    // not tidiness: espeak-ng is GPL-3.0 and is linked by the bridge, so the
    // bridge is licensed GPL-3.0 too. The two are separate programs that meet
    // only over an inter-process interface, and are combined solely at
    // packaging time. Mixing the sources back into one directory would weaken
    // that, on legal advice (2026-09-01).
    //
    // Do NOT move these files back under src/main. See
    // ../tts-bridge/ENGINE_NOTICE.md.
    sourceSets {
        main {
            java.srcDirs += '../tts-bridge/java'
            aidl.srcDirs += '../tts-bridge/aidl'
        }
    }
}

// Refuse to build a release that bundles voice models (added 2026-09-01).
//
// Why this exists: a release APK was built at 221.7 MB because ~185 MB of
// .onnx models were sitting in src/main/assets/kokoro/ and kokoro-gb/ on the
// build machine. Removing them took it to 56.2 MB. Google Play caps the
// per-device download from a bundle at 200 MB, so that build could not ship.
//
// The trap worth guarding: those folders are in .gitignore, so a fresh clone
// never has them and the repo looks clean. But .gitignore governs the REPO,
// not the BUILD, and aapt packages anything under assets/ regardless. The docs
// twice concluded from .gitignore that nothing was bundled; nobody opened the
// APK. This check opens the question at build time instead.
//
// Nothing should ever ship a model in assets: every voice is downloaded at
// runtime into filesDir, and TtsService passes assetManager = null, so a
// bundled copy is never even read. It is pure weight.
// Resolved HERE, at configuration time, not inside the check below. Calling
// file() from inside a doFirst closure fails under Gradle's configuration
// cache with "references a Gradle script object from a Groovy closure at
// execution time". Capturing a plain File up front is the supported shape.
def bundledAssetsDir = file('src/main/assets')
tasks.configureEach { t ->
    if (t.name == 'packageRelease') {
        t.doFirst {
            def assetsDir = bundledAssetsDir
            if (assetsDir.exists()) {
                def models = []
                assetsDir.eachFileRecurse { f ->
                    if (f.isFile() && f.name.endsWith('.onnx')) models << f
                }
                if (!models.isEmpty()) {
                    def total = models.sum { it.length() } / (1024 * 1024)
                    throw new GradleException(
                        "Release build blocked: ${models.size()} voice model(s) " +
                        "(${total.round(1)} MB) are bundled under src/main/assets.\n" +
                        models.collect { "  - ${it.path}" }.join('\n') + "\n" +
                        "Voice packs are downloaded at runtime and a bundled copy is never read.\n" +
                        "Move these out of src/main/assets and rebuild. See TODO.md.")
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Keystore-backed encrypted storage for the native OAuth refresh token
    // (SecureStoragePlugin.kt) — replaces plain WebView localStorage for
    // pl_rtoken.
    // Moved off 1.1.0-alpha06 to 1.1.0 stable on 2026-09-01 (audit finding M5):
    // shipping an ALPHA build of anything is bad, and shipping one to hold an
    // OAuth refresh token is the worst place to do it. 1.1.0 released
    // 2025-07-30.
    // KNOWN, and deliberately accepted for now: Google deprecated every API in
    // this library as of 1.1.0-beta01 (2025-06-04), recommending the platform
    // Keystore APIs directly. That migration is a real piece of work and is
    // tracked in TODO.md; the version bump here is the cheap half that removes
    // the alpha exposure today. Do not read this comment as the library being
    // healthy — it is stable but no longer developed.
    implementation "androidx.security:security-crypto:1.1.0"
    // MediaSessionCompat/PlaybackStateCompat/MediaMetadataCompat (still under
    // the legacy android.support.v4.media package despite this artifact name —
    // a known AndroidX quirk) + androidx.media.app.NotificationCompat.MediaStyle,
    // for PlaybackService's lock-screen transport controls.
    implementation "androidx.media:media:1.7.0"
    // DocumentFile wraps Storage Access Framework tree URIs (LocalFolderPlugin's
    // connect-a-folder feature) — avoids hand-rolling DocumentsContract column
    // queries. Small, stable, no transitive deps beyond androidx.core (already present).
    implementation "androidx.documentfile:documentfile:1.0.1"
    // Google Play's own In-App Review API (StoreReviewPlugin.kt) — shows the
    // native rate-this-app sheet in place. Verify this is still the latest
    // stable release on Maven Central (com.google.android.play:review)
    // before building; bump if a newer one exists.
    implementation "com.google.android.play:review:2.0.2"
    implementation project(':capacitor-android')
    // Native neural TTS: Kokoro via sherpa-onnx (on-device, gapless on phones).
    // Prebuilt AAR (v1.13.4) committed in libs/ — sherpa-onnx has no Maven
    // Central artifact; resolved through the flatDir repo declared below. The
    // AAR bundles the onnxruntime JNI .so for all ABIs (self-contained, no
    // transitive deps).
    implementation(name: 'sherpa-onnx', ext: 'aar')
    // Streams + extracts the downloadable voice-pack .tar.bz2 archives
    // (PhonoLeafTtsPlugin.downloadPack) straight from the upstream sherpa-onnx
    // GitHub release — java.util.zip has no bzip2 support, so this is the
    // standard, well-maintained library for it. On Maven Central directly (no
    // flatDir needed, unlike the AAR above).
    implementation "org.apache.commons:commons-compress:1.28.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
