apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release signing. The keystore and its passwords must NEVER be committed —
// see .gitignore, which excludes *.jks/*.keystore and this properties file.
// Create android/keystore.properties (gitignored) with:
//     storeFile=C:/path/outside/the/repo/phonoleaf-release.jks
//     storePassword=...
//     keyAlias=phonoleaf
//     keyPassword=...
// If that file is absent, no release signingConfig is registered at all and
// `assembleRelease` produces an unsigned build — deliberate, so a fresh clone
// and every debug build still work with nothing extra set up. Losing this
// keystore means never being able to update the Play listing again: back it
// up somewhere durable and off this machine before the first upload.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "com.phonoleaf.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.phonoleaf.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Versioning scheme: versionCode is a plain integer that MUST increase
        // on every upload to Play (it is the only thing Play orders builds by,
        // and a code already uploaded can never be reused, even after a
        // rollback). versionName is the human string shown in the store and in
        // Settings. Bump versionCode by 1 for every build sent to any Play
        // track including internal testing, and move versionName only when the
        // release is user-visible.
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Ship only phone ABIs — the sherpa-onnx AAR carries native libs for
        // four architectures; real devices are arm. Halves the APK.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Don't let aapt compress the ONNX model — compressed ML assets can be
    // misaligned when accessed directly. (We copy to filesDir before loading,
    // but keep this per sherpa-onnx guidance.)
    androidResources {
        noCompress += ['onnx', 'bin']
    }
    // Must match capacitor.build.gradle's compileOptions (regenerated by every
    // `cap sync`, applied AFTER this file, so it wins for Java regardless of
    // what's set here) — kept in sync explicitly so Kotlin doesn't drift from
    // it, which is what caused "Inconsistent JVM-target compatibility".
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    signingConfigs {
        // Registered only when keystore.properties exists (see the top of this
        // file). Referencing a signingConfig that was never created is a
        // configuration-time failure, which is why the buildType below guards
        // on the same condition rather than naming it unconditionally.
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Newer AGP rejects 'proguard-android.txt' (it forces -dontoptimize);
            // the -optimize variant is required. minifyEnabled is false anyway.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    // SPIKE 2026-08-31. Both the sherpa-onnx AAR and onnxruntime-android ship
    // their own lib/<abi>/libonnxruntime.so, which AGP refuses to merge. Both
    // are ONNX Runtime 1.27.0 (the sherpa AAR binary was inspected to confirm
    // the version match), so taking either one is safe; a version SKEW here
    // would be the likely cause of an UnsatisfiedLinkError or a native crash,
    // so re-check this if the sherpa AAR is ever updated.
    // AIDL is off by default from AGP 8 onward and this project is on 9.2.1,
    // so the ITtsService interface would silently not be generated without
    // this. Needed for the out-of-process speech engine (see TtsService.kt).
    buildFeatures {
        aidl true
    }
    packagingOptions {
        pickFirst 'lib/**/libonnxruntime.so'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Keystore-backed encrypted storage for the native OAuth refresh token
    // (SecureStoragePlugin.kt) — replaces plain WebView localStorage for
    // pl_rtoken. 1.1.0-alpha06 is the current androidx.security release using
    // the MasterKey.Builder API (the older MasterKeys object is deprecated).
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    // MediaSessionCompat/PlaybackStateCompat/MediaMetadataCompat (still under
    // the legacy android.support.v4.media package despite this artifact name —
    // a known AndroidX quirk) + androidx.media.app.NotificationCompat.MediaStyle,
    // for PlaybackService's lock-screen transport controls.
    implementation "androidx.media:media:1.7.0"
    // DocumentFile wraps Storage Access Framework tree URIs (LocalFolderPlugin's
    // connect-a-folder feature) — avoids hand-rolling DocumentsContract column
    // queries. Small, stable, no transitive deps beyond androidx.core (already present).
    implementation "androidx.documentfile:documentfile:1.0.1"
    // Google Play's own In-App Review API (StoreReviewPlugin.kt) — shows the
    // native rate-this-app sheet in place. Verify this is still the latest
    // stable release on Maven Central (com.google.android.play:review)
    // before building; bump if a newer one exists.
    implementation "com.google.android.play:review:2.0.2"
    implementation project(':capacitor-android')
    // Native neural TTS: Kokoro via sherpa-onnx (on-device, gapless on phones).
    // Prebuilt AAR (v1.13.4) committed in libs/ — sherpa-onnx has no Maven
    // Central artifact; resolved through the flatDir repo declared below. The
    // AAR bundles the onnxruntime JNI .so for all ABIs (self-contained, no
    // transitive deps).
    implementation(name: 'sherpa-onnx', ext: 'aar')
    // SPIKE 2026-08-31: the ONNX Runtime JAVA API, which the sherpa AAR does
    // NOT expose (its classes.jar contains only com.k2fsa.sherpa.onnx). Needed
    // to drive Supertonic's four-stage ONNX pipeline directly. Version pinned
    // to match the runtime already inside the sherpa AAR. Remove together with
    // SupertonicSpike.kt if the engine evaluation goes the other way.
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.27.0"
    // Streams + extracts the downloadable voice-pack .tar.bz2 archives
    // (PhonoLeafTtsPlugin.downloadPack) straight from the upstream sherpa-onnx
    // GitHub release — java.util.zip has no bzip2 support, so this is the
    // standard, well-maintained library for it. On Maven Central directly (no
    // flatDir needed, unlike the AAR above).
    implementation "org.apache.commons:commons-compress:1.28.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
